# SPDX-License-Identifier: AGPL-3.0-only
# Arca — paranoid, memory-safe document viewer core.
# Additional terms under AGPLv3 section 7: see LICENSE_ADDITIONAL_TERMS.md.

[workspace]
resolver = "3"
members = [
    "crates/arca-digest",
    "crates/arca-abi",
    "crates/arca-container",
    "crates/arca-xray",
    "crates/arca-preview",
    "crates/arca-sandbox",
    "crates/arca-guest-xray",
    "crates/arca-attribution",
    "crates/arca-engine",
    "crates/arca-jni",
    "crates/arca-image",
    "crates/arca-ffi",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
# Placeholder identity; kept in sync with AUTHORS and arca-attribution (see AUTHORS).
authors = ["Pharos"]
license = "AGPL-3.0-only"
publish = false

# ---------------------------------------------------------------------------
# Supply chain policy (see docs/ARCHITECTURE.md §7):
#   * pure-Rust crates only, no C/C++ toolchains, no `*-sys` crates;
#   * versions pinned exactly — every bump is a reviewed change;
#   * default features off, only what is audited is enabled.
# ---------------------------------------------------------------------------
[workspace.dependencies]
arca-digest = { path = "crates/arca-digest" }
arca-abi = { path = "crates/arca-abi" }
arca-container = { path = "crates/arca-container" }
arca-xray = { path = "crates/arca-xray" }
arca-preview = { path = "crates/arca-preview" }
arca-sandbox = { path = "crates/arca-sandbox" }
arca-attribution = { path = "crates/arca-attribution" }
arca-guest-xray = { path = "crates/arca-guest-xray" }
arca-engine = { path = "crates/arca-engine" }
arca-image = { path = "crates/arca-image" }
arca-ffi = { path = "crates/arca-ffi" }

# Wasm interpreter (no JIT: iOS forbids W^X pages for third-party apps).
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
wasmi_core = { version = "=2.0.0", default-features = false, features = ["std"] }
# Streaming pull XML parser; DOCTYPE/entities are rejected by arca-container.
quick-xml = { version = "=0.42.0", default-features = false }
# DEFLATE; the crate is `#![forbid(unsafe_code)]`.
miniz_oxide = { version = "=0.9.0", default-features = false, features = ["with-alloc"] }
# Volatile, non-elidable wiping of document buffers.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# ---------------------------------------------------------------------------
# Lints: the security floor of the project. Every crate opts in with
# `[lints] workspace = true`. Do not weaken these in a crate manifest.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Mandated by the specification.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
# Additional hardening: no placeholders, no silent truncation, no stray output.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
exit = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
string_slice = "warn"
get_unwrap = "deny"

# ---------------------------------------------------------------------------
# Profiles: integer overflow is a bug class we refuse to ship silently.
# ---------------------------------------------------------------------------
[profile.dev]
overflow-checks = true

# NOTE: do not raise the optimisation level of `wasmi` in this profile. wasmi
# selects tail-call dispatch for optimised builds, and with that combination
# (dev profile: debug assertions on, 256 codegen units, no LTO) the sandbox
# worker's native stack was observed to overflow even at 16 MiB, while the
# default dev build (portable loop dispatch) and the release build (tail calls
# compiled to jumps) both run in constant stack. The guest end-to-end tests are
# run with `cargo test --release` in CI, where the interpreter is ~40 % faster
# than with portable dispatch (measured: 675 ms vs 1100 ms on a 500 kB sheet).

[profile.release]
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 1
strip = "symbols"

# Wasm guests are built with: cargo build --profile guest --target wasm32-unknown-unknown
[profile.guest]
inherits = "release"
panic = "abort"
# The guest runs in an interpreter, where speed matters more than size: the
# size-optimised build (`"s"`) was ~35 % slower on real spreadsheets for a
# ~12 % smaller module (measured with `arca-guest-xray --example measure`).
opt-level = 3
lto = "fat"
