# SPDX-License-Identifier: AGPL-3.0-only
# CI for the Rust core. Third-party actions are pinned to full commit SHAs.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Cargo.lock is committed: every build is locked.
  LOCKED: --locked

jobs:
  policy:
    name: policy (no unsafe, no placeholders, no C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/check-unsafe.sh

  core:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets $LOCKED
      - run: cargo test --workspace $LOCKED
      - name: fork attribution path (example file)
        run: ARCA_FORK_ATTRIBUTION="$PWD/fork_attribution.example.toml" cargo test -p arca-attribution $LOCKED
      - name: release gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: ARCA_RELEASE=1 cargo build -p arca-attribution --release $LOCKED

  guest:
    name: wasm guest in the sandbox (end to end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: build guest (and check that it imports nothing)
        run: bash tools/build-guest.sh
      - name: end-to-end tests (release profile, the interpreter is far too slow in debug)
        # The guest runs in wasmi inside the real sandbox. ARCA_REQUIRE_E2E turns "guest not
        # found" from a skip into a failure; the fixtures are the real-software documents.
        env:
          ARCA_REQUIRE_E2E: "1"
          ARCA_CORPUS_DIR: ${{ github.workspace }}/tests/fixtures
        run: |
          export ARCA_GUEST_WASM="$PWD/target/wasm32-unknown-unknown/guest/arca_guest_xray.wasm"
          export ARCA_GUEST_XRAY_WASM="$ARCA_GUEST_WASM"
          cargo test --release -p arca-guest-xray --test e2e_sandbox $LOCKED -- --nocapture
          # The engine and the JNI layer, with the real guest embedded.
          cargo test --release -p arca-engine -p arca-jni $LOCKED
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arca_guest_xray.wasm
          path: target/wasm32-unknown-unknown/guest/arca_guest_xray.wasm

  reproducible:
    name: reproducible build (guest and JNI library, two directories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: build twice and compare SHA-256
        run: bash tools/check-reproducible.sh

  # Reproducibility evidence for the Wasm guest (issues #43 and #53): the module the sandbox
  # pins by SHA-256 is built from the same source in two different Linux distributions, each
  # with its own rustup, the toolchain pinned by rust-toolchain.toml, `--locked`, a different
  # build directory, path remapping and a fixed SOURCE_DATE_EPOCH. The job fails unless both
  # hashes are equal and prints the hash. (The APK as a whole is not claimed to be bit-for-bit
  # reproducible; this job covers the guest only.) The container images are the distributions'
  # moving tags on purpose: the point is that a different base system gives the same bytes.
  reproducible-guest:
    name: reproducible Wasm guest (ubuntu:22.04 and debian:bookworm, same SHA-256)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the guest in two clean containers
        run: |
          set -euo pipefail
          mkdir -p out
          for image in ubuntu:22.04 debian:bookworm; do
            label="${image//[:\/]/-}"
            docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" "$image" \
              bash /src/tools/repro-guest-container.sh "$label" /out
          done
      - name: compare the SHA-256 of the two builds
        run: |
          set -euo pipefail
          cat out/*.sha256
          distinct="$(cut -d' ' -f1 out/*.sha256 | sort -u)"
          if [ "$(printf '%s\n' "$distinct" | wc -l)" != 1 ] || [ "$(ls out/*.sha256 | wc -l)" != 2 ]; then
            echo "::error::arca_guest_xray.wasm differs between the containers (or a build is missing)"
            exit 1
          fi
          echo "arca_guest_xray.wasm SHA-256 (identical in both): $distinct"
          { echo "### arca_guest_xray.wasm"; echo; echo '`'"$distinct"'` (ubuntu:22.04 = debian:bookworm)'; } >> "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all
