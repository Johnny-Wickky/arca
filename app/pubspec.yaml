# SPDX-License-Identifier: AGPL-3.0-only
# Arca mobile client (Android / iOS). Implemented in Phase 4; see README.md.
name: arca
description: Paranoid, memory-safe viewer for Office and technical documents.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# Dependency policy (enforced in review):
#   * no analytics, crash-reporting, advertising or remote-config packages;
#   * no package that needs the INTERNET permission or opens sockets;
#   * every package pinned to an exact version, licence compatible with AGPL-3.0.
# Phase 4 adds flutter_rust_bridge (v2) for the bridge to crates/arca-ffi.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Original iconography only (no Material icon font, no SF Symbols).
  uses-material-design: false
