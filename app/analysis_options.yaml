# Strict analysis without third-party lint packages (no extra dependencies).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - require_trailing_commas
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_build_context_synchronously
