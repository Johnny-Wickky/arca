[package]
name = "arca-xray"
description = "Threat X-Ray: format identification, active-content detection, forensic metadata and sterilisation for office documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Like arca-container this crate is I/O-free and compiles for the
# wasm32-unknown-unknown guest that runs it inside arca-sandbox.
[dependencies]
arca-abi.workspace = true
arca-container.workspace = true
arca-digest.workspace = true
arca-image.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true

[dev-dependencies]
arca-container = { workspace = true, features = ["test-support"] }
# The malware lab runs every sample through the guest's own request path (the code that runs in
# the sandbox). A dev-dependency cycle is allowed: the guest depends on this crate, not the other
# way round, for anything that ships.
arca-guest-xray.workspace = true

[lints]
workspace = true
